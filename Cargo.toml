[package]
name = "gray-repguard"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "tool-call repetition guard: nudges the agent out of identical-call loops"

[[bin]]
name = "gray-repguard"
path = "src/main.rs"

[lib]
name = "gray_repguard"
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
